<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>Lòngkai · scegli la password</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#24130c">
    <link rel="icon" type="image/png" sizes="32x32" href="icone/favicon-32.png">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <!-- Pagina a sé, fuori dall'app: funziona anche se il telefono ha in memoria una versione vecchia dell'app.
       Il link è password.html#<codice>: il codice si usa solo quando si tocca Salva. -->
  <div class="app">
    <div class="accesso">
      <span class="logo apertura-logo" aria-hidden="true"></span>
      <h1 class="apertura-nome">LÒNGKAI</h1>
      <form class="accesso-modulo" id="modulo" novalidate>
        <p class="accesso-nota">Almeno 12 caratteri, lettere e numeri.</p>
        <label class="accesso-campo"><span>Nuova password</span><input id="p1" type="password" autocomplete="new-password" required minlength="12"></label>
        <label class="accesso-campo"><span>Ripetila</span><input id="p2" type="password" autocomplete="new-password" required minlength="12"></label>
        <p class="accesso-errore" id="errore" role="alert"></p>
        <button class="accesso-entra" type="submit" id="salva">Salva la password</button>
      </form>
    </div>
  </div>
  <noscript><p class="noscript">Serve JavaScript per scegliere la password.</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/password.js"></script>
</body>
</html>
