<!DOCTYPE html>
<html lang="it" data-tema="scuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>Longkai — scegli la password</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1613">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" sizes="32x32" href="icone/favicon-32.png">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <!-- Pagina a sé, fuori dall'app: funziona anche se il telefono ha in memoria una versione vecchia dell'app.
       Il link è password.html#<codice>: il codice si usa solo quando si tocca Salva. -->
  <main class="contenuto" id="contenuto">
    <div class="accesso">
      <img src="icone/logo-oro.png" alt="Longkai">
      <h1>Longkai</h1>
      <form id="modulo" novalidate>
        <p class="attenuato">Scegli la tua password: almeno 12 caratteri, con lettere e numeri. Una che usi solo qui.</p>
        <div class="campo"><label for="p1">Nuova password</label><input id="p1" type="password" autocomplete="new-password" required minlength="12"></div>
        <div class="campo"><label for="p2">Ripetila</label><input id="p2" type="password" autocomplete="new-password" required minlength="12"></div>
        <p class="errore-campo" id="errore" role="alert"></p>
        <button class="tasto pieno grande" type="submit" id="salva">Salva la password</button>
      </form>
    </div>
  </main>
  <noscript><p class="noscript">Serve JavaScript per scegliere la password.</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/password.js"></script>
</body>
</html>
